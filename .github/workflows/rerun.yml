name: In-run re-run

on:
  push:
    branches: [rerun-in-run-test]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tdpw test tests/rerun.spec.ts --shard=${{ matrix.shard }}/4 --no-artifacts
        env:
          TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
          TESTDINO_SERVER_URL: ${{ vars.TESTDINO_SERVER_URL }}
